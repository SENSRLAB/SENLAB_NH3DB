[theme]
base = "light"

# 색 — 흰 배경 + 남색 계열 글씨 (2026-11 라이트 테마)
textColor = "#1e293b"
primaryColor = "#1e3a8a"
linkColor = "#1d4ed8"
linkUnderline = false
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6fa"
codeBackgroundColor = "#f1f5f9"
borderColor = "#cbd5e1"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#e8edf5"
dataframeBorderColor = "#cbd5e1"

# 본문 글꼴 — 한글 지원 (demo는 Space Grotesk라 한글 불가)
font = "'IBM Plex Sans KR':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap, sans-serif"
baseFontWeight = 400
baseFontSize = 14

# 제목 글꼴 — demo와 동일한 Space Grotesk, 한글은 본문 폰트로 대체
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap, 'IBM Plex Sans KR', sans-serif"
headingFontWeights = [300, 400, 400, 300, 300, 300]
headingFontSizes = ["2.5rem", "1.5rem", "1rem"]
codeFont = "monospace"

# 그래프 색 — 흰 배경에서 잘 보이는 진한 팔레트(남색·갈색·녹색·적색·보라·청록)
chartCategoricalColors = ["#1e3a8a", "#b45309", "#047857", "#b91c1c", "#6d28d9", "#0e7490"]

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
