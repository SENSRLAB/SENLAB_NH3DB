[theme]
base = "dark"

# 색 — demo-stockpeers와 동일
textColor = "#e2e8f0"
primaryColor = "#615fff"
linkColor = "#8b8aff"
linkUnderline = false
backgroundColor = "#1d293d"
secondaryBackgroundColor = "#0f172b"
codeBackgroundColor = "#0f172b"
borderColor = "#314158"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#1d293d"
dataframeBorderColor = "#314158"

# 본문 글꼴 — 한글 지원 (demo는 Space Grotesk라 한글 불가)
font = "'IBM Plex Sans KR':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap, sans-serif"
baseFontWeight = 400
baseFontSize = 14

# 제목 글꼴 — demo와 동일한 Space Grotesk, 한글은 본문 폰트로 대체
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap, 'IBM Plex Sans KR', sans-serif"
headingFontWeights = [300, 400, 400, 300, 300, 300]
headingFontSizes = ["2.5rem", "1.5rem", "1rem"]
codeFont = "monospace"

# 그래프 색 — 보라 강조색과 어울리는 팔레트
chartCategoricalColors = ["#615fff", "#F2A65A", "#5FD19B", "#F77A8E", "#7AA2F7", "#FFD166"]

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
